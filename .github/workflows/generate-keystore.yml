name: Generate Keystore (Run Once)

on:
  workflow_dispatch:  # 只能手動觸發

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - name: Generate Keystore
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        keytool -genkey -v \
          -keystore scalebridge.keystore \
          -alias "$KEY_ALIAS" \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass "$KEYSTORE_PASSWORD" \
          -keypass "$KEY_PASSWORD" \
          -dname "CN=ScaleBridge, OU=Dev, O=Company, L=City, ST=State, C=TW"

    - name: Output Base64
      run: |
        echo "=========================================="
        echo "請複製下面這段 Base64 到 GitHub Secrets"
        echo "Secret Name: KEYSTORE_BASE64"
        echo "=========================================="
        base64 -w 0 scalebridge.keystore
        echo ""
        echo "=========================================="

    - name: Upload Keystore as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keystore-backup
        path: scalebridge.keystore
        retention-days: 1

